name: Build Python ESTMEDI to EXE

on: [push]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Upgrade pip and install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pillow pyinstaller

    - name: Verify main.py and build with PyInstaller
      run: |
        echo "Checking files in current directory..."
        dir
        pyinstaller --noconsole --onefile --name ESTMEDI main.py

    - name: Upload EXE artifact
      uses: actions/upload-artifact@v4
      with:
        name: ESTMEDI-Python-EXE
        path: dist/ESTMEDI.exe
