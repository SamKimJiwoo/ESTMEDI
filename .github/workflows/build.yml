name: Build C++ ESTMEDI to EXE

on: [push]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up MinGW
      uses: egor-tukin/setup-mingw@v2
      with:
        version: 12.2.0

    - name: Compile C++ Code with g++
      run: |
        g++ main.cpp -o ESTMEDI.exe -static

    - name: Upload EXE artifact
      uses: actions/upload-artifact@v3
      with:
        name: ESTMEDI-C++-EXE
        path: ESTMEDI.exe
