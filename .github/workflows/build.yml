name: Build C++ ESTMEDI to EXE

on: [push]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: false
        install: mingw-w64-ucrt-x86_64-gcc

    - name: Compile C++ Code
      shell: msys2 {0}
      run: |
        g++ main.cpp -o ESTMEDI.exe -static

    - name: Upload EXE artifact
      uses: actions/upload-artifact@v4
      with:
        name: ESTMEDI-CPP-EXE
        path: ESTMEDI.exe
