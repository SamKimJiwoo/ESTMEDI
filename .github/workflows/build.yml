name: Build C++ ESTMEDI to EXE

on: [push]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Compile C++ Code
      run: |
        g++ main.cpp -o ESTMEDI.exe

    - name: Upload EXE artifact
      uses: actions/upload-artifact@v3
      with:
        name: ESTMEDI-C++-EXE
        path: ESTMEDI.exe
